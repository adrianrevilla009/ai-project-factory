rules:
  - id: config-literal-secret-in-properties
    languages: [generic]
    severity: ERROR
    message: >-
      Literal value for a password/secret/token key in a config file. Use a placeholder
      (${DB_PASSWORD}) or a Vault/secret-store reference. Example values must contain
      "example" or "changeme" and live only in *.example files.
    paths:
      include:
        - "**/application*.yml"
        - "**/application*.yaml"
        - "**/application*.properties"
      exclude:
        - "**/src/test/**"
    pattern-regex: '(?im)^\s*[\w.-]*(password|secret|token|api[-_]?key)\s*[:=]\s*(?!\$\{|\s*$|"?\$\{|changeme|example)[^\s#]{4,}'
    metadata:
      skill: config-by-environment
