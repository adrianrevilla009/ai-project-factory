rules:
  - id: java-unbounded-executors
    languages: [java]
    severity: ERROR
    message: "Executor sin cota o hilo manual. Usar ThreadPoolExecutor/ThreadPoolTaskExecutor con cola acotada (skill threads-executors-and-pools)."
    pattern-either:
      - pattern: Executors.newCachedThreadPool(...)
      - pattern: Executors.newFixedThreadPool(...)
      - pattern: new Thread(...)
    metadata:
      skill: threads-executors-and-pools
      note: "Probada con semgrep 1.184.0 (tests/semgrep)."
