rules:
  - id: llm-direct-provider-url
    languages: [java, yaml, generic]
    severity: WARNING
    message: "URL directa de proveedor LLM. Usar la URL de la pasarela interna (skill llm-gateway)."
    pattern-regex: 'https://api\.(openai\.com|anthropic\.com|mistral\.ai|cohere\.com)'
    paths:
      exclude:
        - "**/src/test/**"
    metadata:
      skill: llm-gateway
      note: "TODO-VERIFY: no ejecutada con semgrep. Falsos positivos posibles en docs; ajustar paths."
