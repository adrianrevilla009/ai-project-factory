rules:
  - id: dbt-model-select-star-from-source
    languages: [generic]
    severity: WARNING
    message: "select * directo desde source() en un modelo dbt: una columna nueva upstream rompe el contrato aguas abajo. Enumerar columnas (skill etl-vs-elt-and-dbt)."
    paths:
      include:
        - "*.sql"
    pattern-regex: '(?is)select\s+\*\s+from\s+\{\{\s*source\('
    metadata:
      skill: etl-vs-elt-and-dbt
      note: "Probada con semgrep 1.184.0 (tests/semgrep)."
