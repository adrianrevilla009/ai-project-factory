rules:
  - id: spring-http-client-without-timeout
    languages: [java]
    severity: ERROR
    message: "Cliente HTTP sin timeouts explicitos. Usar RestClient.Builder con timeouts configurados (skill http-clients-and-timeouts)."
    pattern-either:
      - pattern: new RestTemplate()
      - pattern: java.net.http.HttpClient.newHttpClient()
    metadata:
      skill: http-clients-and-timeouts
      note: "Probada con semgrep 1.184.0 (tests/semgrep)."
