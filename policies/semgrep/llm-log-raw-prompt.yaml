rules:
  - id: llm-log-raw-prompt
    languages: [java]
    severity: WARNING
    message: "Registro de prompt/entrada de usuario sin redactar. Registrar solo metadatos o texto redactado (skill guardrails-and-pii-redaction)."
    pattern-regex: 'log(ger)?\.(info|debug|trace|warn)\((?:[^;"]|"(?:[^"\\]|\\.)*")*(?:,\s*|\+\s*)(prompt|userText|userInput|userMessage)\s*[,)+]'
    metadata:
      skill: guardrails-and-pii-redaction
      note: "Heuristica por nombre de variable (prompt, userText, userInput, userMessage) pasada como argumento o concatenada; no ve el contenido real."
