rules:
  - id: jpa-toone-without-lazy
    languages: [java]
    severity: ERROR
    message: "@ManyToOne/@OneToOne es EAGER por defecto. Usar fetch = FetchType.LAZY (skill n-plus-one)."
    patterns:
      - pattern-either:
          - pattern: |
              @ManyToOne
              $T $F;
          - pattern: |
              @OneToOne
              $T $F;
          - pattern: |
              @ManyToOne(fetch = FetchType.EAGER)
              $T $F;
          - pattern: |
              @OneToOne(fetch = FetchType.EAGER)
              $T $F;
    metadata:
      skill: n-plus-one
      note: "TODO-VERIFY: probar la regla con semgrep antes de darla por buena; no ejecutada en Oleada 0."
