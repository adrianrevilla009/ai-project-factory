# módulo -> bloques, skills, políticas, pruebas y tableros que guían su implementación.
# Los módulos «siempre activos» (always_on en capabilities.yaml) llevan bloques enteros; los activables, skills concretas.
# Esta fábrica solo contiene guías (ADR-0038). `make validate` comprueba que cada skill, bloque y política citados existan.
# `tests` nombra skills que definen la prueba; `dashboards` describe los tableros que el proyecto debe tener.
